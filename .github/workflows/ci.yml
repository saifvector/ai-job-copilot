name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ----------------------------------------------------------------------------
  # Backend Quality Gate: Lint, Type Check, and Pytest Suite
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx flake8 mypy

      - name: Run Backend Linter
        run: |
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest Suite
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-testing-secret-key-at-least-32-chars-long"
          ENVIRONMENT: "test"
        run: |
          cd backend
          pytest tests/ -v --maxfail=1

  # ----------------------------------------------------------------------------
  # Frontend Quality Gate: Typecheck, Lint, and Vitest Suite
  # ----------------------------------------------------------------------------
  frontend-test:
    name: Frontend Lint & Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Run TypeScript Type-Check
        run: |
          cd frontend
          npm run type-check

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm test

  # ----------------------------------------------------------------------------
  # Production Container Build Verification
  # ----------------------------------------------------------------------------
  build-check:
    name: Docker Container Build Verification
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: jobcopilot-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: jobcopilot-frontend:ci
